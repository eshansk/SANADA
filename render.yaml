services:
  - type: web
    name: sanada-backend-api
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt && python scripts/download_checkpoints.py
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.0
